<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Finder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .slideshow-container {
      position: relative;
      height: 80vh;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      will-change: opacity;
    }
    .slide-active {
      opacity: 1;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: kenBurns 10s ease-in-out infinite;
    }
    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.1) translate(-2%, -2%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .slide-content {
      position: absolute;
      bottom: 10%;
      left: 5%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 1.5rem;
      max-width: 50%;
      border-radius: 4px;
    }
    .next-slide-preview {
      position: absolute;
      bottom: 10%;
      right: 5%;
      max-width: 150px;
      width: 20%;
      opacity: 0.7;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .next-slide-preview:hover {
      opacity: 1;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: #3B82F6;
      padding: 1rem;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .nav-arrow:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    [data-theme="light"] {
      background-color: #F5F5F5;
      color: #1A2526;
    }
    [data-theme="dark"] {
      background-color: #1A2526;
      color: #F5F5F5;
    }
    .nav-bg-light {
      background-color: #4B5563;
    }
    .nav-bg-dark {
      background-color: #111827;
    }
    .footer-bg-light {
      background-color: #3B82F6;
    }
    .footer-bg-dark {
      background-color: #1E3A8A;
    }
    .icon-light {
      color: #3B82F6;
    }
    .icon-dark {
      color: #F5F5F5;
    }
    .hover-blue:hover {
      color: #3B82F6;
    }
    .sound-active {
      background-color: #3B82F6;
      color: white;
    }
    .icon {
      width: 1.5rem;
      height: 1.5rem;
    }
    .news-container-light {
      background-color: rgba(0, 0, 0, 0.2);
    }
    .news-container-dark {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .logo {
      position: fixed;
      top: 1rem;
      left: 1rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #3B82F6;
      z-index: 50;
    }
    .search-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6B7280;
    }
    .click-sound {
      cursor: pointer;
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
      will-change: opacity, transform;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 640px) {
      .slide-content {
        max-width: 80%;
        padding: 1rem;
      }
      .next-slide-preview {
        width: 30%;
        max-width: 120px;
      }
      .text-3xl {
        font-size: 1.5rem;
      }
      .text-sm {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body className="transition-colors duration-300">
  <div id="root"></div>
  <audio id="clickSound" src="https://freesound.org/data/previews/612/612095_5674468-lq.mp3"></audio>
  <script type="text/babel">
    function App() {
      const [darkMode, setDarkMode] = React.useState(false);
      const [currentSlide, setCurrentSlide] = React.useState(0);
      const [soundEnabled, setSoundEnabled] = React.useState(false);
      const [searchQuery, setSearchQuery] = React.useState('');

      // Toggle dark mode
      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        document.documentElement.setAttribute('data-theme', !darkMode ? 'dark' : 'light');
        playSound();
      };

      // Toggle sound
      const toggleSound = () => {
        setSoundEnabled(!soundEnabled);
        playSound();
      };

      // Play click sound
      const playSound = () => {
        if (soundEnabled) {
          const audio = document.getElementById('clickSound');
          audio.play().catch(() => {});
        }
      };

      // Handle search input
      const handleSearchChange = (e) => {
        setSearchQuery(e.target.value);
      };

      // Handle search submit
      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (searchQuery.trim()) {
          playSound();
          window.location.href = `search-results.html?query=${encodeURIComponent(searchQuery)}`;
        }
      };

      // Sample slides
      const slides = [
        { id: 1, title: "Springfield High", img: "https://via.placeholder.com/1920x1080?text=Springfield+High", desc: "Top-rated public school with vibrant student life" },
        { id: 2, title: "Riverside Academy", img: "https://via.placeholder.com/1920x1080?text=Riverside+Academy", desc: "Renowned for arts and culture programs" },
        { id: 3, title: "Oakwood College", img: "https://via.placeholder.com/1920x1080?text=Oakwood+College", desc: "Leading in STEM education and innovation" },
      ];

      // Handle slide navigation
      const nextSlide = () => {
        setCurrentSlide((prev) => (prev + 1) % slides.length);
        playSound();
      };

      const prevSlide = () => {
        setCurrentSlide((prev) => (prev - 1 + slides.length) % slides.length);
        playSound();
      };

      // Get next slide index
      const nextSlideIndex = (currentSlide + 1) % slides.length;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Logo */}
          <div className="logo">School Finder</div>

          {/* Navigation Bar */}
          <nav className={darkMode ? "nav-bg-dark p-3 fixed top-0 w-full shadow-lg z-40" : "nav-bg-light p-3 fixed top-0 w-full shadow-lg z-40"}>
            <div className="container mx-auto flex justify-end items-center">
              <ul className="flex space-x-6 text-sm text-white">
                <li><a href="#" className="hover-blue transition" onClick={playSound}>Home</a></li>
                <li><a href="#" className="hover-blue transition" onClick={playSound}>About</a></li>
                <li><a href="#" className="hover-blue transition" onClick={playSound}>Contact</a></li>
              </ul>
              <div className="flex items-center space-x-4 ml-6">
                <button
                  onClick={toggleSound}
                  className={`click-sound text-sm text-white hover-blue transition px-4 py-2 rounded ${soundEnabled ? 'sound-active' : ''}`}
                >
                  {soundEnabled ? 'Sound Off' : 'Sound On'}
                </button>
                <button
                  onClick={toggleDarkMode}
                  className="click-sound flex items-center space-x-2 text-sm text-white hover-blue transition px-4 py-2 rounded"
                >
                  {darkMode ? (
                    <svg className="icon icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                  ) : (
                    <svg className="icon icon-light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                  )}
                  <span>{darkMode ? 'Light Mode' : 'Dark Mode'}</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Slideshow */}
          <div className="slideshow-container mt-16">
            {slides.map((slide, index) => (
              <div
                key={slide.id}
                className={`slide ${index === currentSlide ? 'slide-active' : ''}`}
              >
                <img src={slide.img} alt={slide.title} loading="lazy" />
                <div className="slide-content">
                  <h2 className="text-3xl font-bold mb-2">{slide.title}</h2>
                  <p className="text-sm">{slide.desc}</p>
                </div>
              </div>
            ))}
            {/* Next Slide Preview */}
            <div className="next-slide-preview" onClick={nextSlide}>
              <img src={slides[nextSlideIndex].img} alt={slides[nextSlideIndex].title} loading="lazy" />
              <p className="text-xs text-center text-white mt-2">Next: {slides[nextSlideIndex].title}</p>
            </div>
            {/* Navigation Arrows */}
            <div className="nav-arrow left-4" onClick={prevSlide}>←</div>
            <div className="nav-arrow right-4" onClick={nextSlide}>→</div>
          </div>

          {/* Search Box */}
          <div className="container mx-auto my-12 px-4 fade-in">
            <div className="search-container">
              <form onSubmit={handleSearchSubmit}>
                <svg className="search-icon icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input
                  type="text"
                  placeholder="Search for schools..."
                  className="w-full pl-12 pr-4 py-3 rounded-lg bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-[#3B82F6]/50 text-sm"
                  value={searchQuery}
                  onChange={handleSearchChange}
                  onClick={playSound}
                  aria-label="Search for schools"
                />
              </form>
            </div>
          </div>

          {/* News Section */}
          <div className="container mx-auto px-4 mb-12 fade-in">
            <div className={darkMode ? "news-container-dark p-8 rounded-lg" : "news-container-light p-8 rounded-lg"}>
              <h2 className="text-2xl font-bold mb-4">News</h2>
              <p className="text-sm">
                Discover the latest updates from our school community. From events to achievements, stay connected with the stories that shape our campuses.
              </p>
            </div>
          </div>

          {/* Footer */}
          <footer className={darkMode ? "footer-bg-dark text-white py-6 mt-auto" : "footer-bg-light text-white py-6 mt-auto"}>
            <div className="container mx-auto px-4 flex justify-center space-x-6 text-sm">
              <a href="#" className="hover-blue transition px-4 py-2" onClick={playSound}>Facebook</a>
              <a href="#" className="hover-blue transition px-4 py-2" onClick={playSound}>Twitter</a>
              <a href="#" className="hover-blue transition px-4 py-2" onClick={playSound}>Instagram</a>
              <a href="#" className="hover-blue transition px-4 py-2" onClick={playSound}>Portfolio</a>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
